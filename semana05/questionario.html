<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário sobre HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <header>
        <h1>Questionário sobre HTML e CSS</h1>
    </header>
    <main>
        <form>
            <div class="form-item">
                <label for="q1">1. Qual tag HTML é usada para criar um parágrafo?</label>
                <input type="text" id="q1" name="q1" placeholder="Ex: <p>">
            </div>

            <div class="form-item">
                <label for="q2">2. Para que serve o CSS?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Qual propriedade muda a cor de fundo?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="color">color</option>
                    <option value="background-color">background-color</option>
                    <option value="font-size">font-size</option>
                    <option value="margin">margin</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. Quantos níveis de cabeçalho existem no HTML?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Enviar Questionário</button>
        </form>
    </main>

</body>

</html>
